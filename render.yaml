services:
  - type: web
    name: ai-concept-coach-demo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: SQLITE_DB_PATH
        value: /var/data/concept-coach.db
    disk:
      name: ai-concept-coach-data
      mountPath: /var/data
      sizeGB: 1
